<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <header class="max-w-7xl mx-auto">
    <div class="navbar bg-base-100 shadow-sm font-bold text-gray-500">
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
            </svg>
          </div>
          <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
            <li><a>Home</a></li>
            <li><a>Product</a></li>
            <li><a>About</a></li>
            <li><a>Contact</a></li>
          </ul>
        </div>
        <a class="btn btn-ghost text-xl text-blue-500 font-bold">SwiftCart</a>
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li><a>Home</a></li>
          <li><a>Product</a></li>
          <li><a>About</a></li>
          <li><a>Contact</a></li>
        </ul>
      </div>
      <div class="navbar-end mr-6">
        <a class="text-gray-500"><i class="fa-solid fa-cart-arrow-down"></i></a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <div class="hero min-h-[600px] bg-cover bg-center" style="background-image: url(/assets/banner-image.png);">

    <div class="hero-overlay bg-opacity-60"></div>

    <div class="hero-content text-neutral-content w-full justify-start px-10 md:px-20">
      <div class="max-w-xl text-left">
        <h1 class="mb-5 text-5xl font-bold leading-tight">
          Best Collection For You
        </h1>
        <p class="mb-8 text-lg opacity-90">
          Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at SwiftCart.
        </p>
        <button class="btn btn-primary bg-indigo-600 border-none px-8 hover:bg-indigo-700">
          Shop Now
        </button>
      </div>
    </div>
  </div>

</body>

</html>
